<!doctype html>

  html, body { margin: 0; }
  html, body { background: var(--background, #1a1f25) !important; color: var(--foreground, #ffffff) !important; color-scheme: dark; min-height: 100%; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--background); }
  .art { position: absolute; inset: 0; }
  .slab { fill: var(--background-light); rx: var(--radius-xl); }

  .tint { fill: var(--primary-300); }
  .deep { fill: var(--primary-700); }
  .dot { fill: var(--primary-500); }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .cover-name { font-family: var(--font-hero); font-weight: 900; font-size: 80px; line-height: .95; color: var(--foreground); margin: 0; letter-spacing: -0.01em; }
  .tag { font-family: var(--font-body); font-weight: 300; font-size: 14px; color: var(--text-body); margin: 16px 0 0; }
